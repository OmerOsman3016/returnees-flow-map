<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudan | Cross-Border Movement Flow</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1421;font-family:system-ui,sans-serif}
#wrap{position:relative;width:100%;height:100vh}
#map{position:absolute;inset:0;z-index:1}
.leaflet-tile{filter:brightness(.16) saturate(.3) hue-rotate(200deg) contrast(1.05)}
.leaflet-container{background:#0d1421}
.leaflet-control-attribution{font-size:9px!important;background:rgba(0,0,0,.5)!important;color:#555!important}
.leaflet-control-zoom a{background:#1a2740!important;color:#aaa!important;border-color:#2a3a54!important}
.leaflet-popup-content-wrapper{background:#141e30!important;border:1px solid #2a3a54!important;border-radius:8px!important;color:#e8eaf0!important}
.leaflet-popup-tip{background:#141e30!important}
.leaflet-popup-content{font-size:12px!important;color:#e8eaf0!important;line-height:1.6!important}
#canvas{position:absolute;inset:0;pointer-events:none;z-index:10}

/* LEFT PANEL */
#left{position:absolute;top:0;left:0;bottom:0;width:270px;z-index:20;background:rgba(10,16,28,.95);border-right:1px solid #1e2d44;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:10px 12px;border-bottom:1px solid #1e2d44;background:rgba(65,143,222,.1)}
.ph h1{font-size:13px;font-weight:700;color:#e8eaf0;letter-spacing:.02em}
.ph p{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#5a7090;margin-top:2px}

.ctrl{padding:8px 12px;border-bottom:1px solid #1e2d44;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cbtn{padding:4px 9px;border-radius:4px;border:1px solid #2a3a54;background:transparent;color:#8a9ab5;font-size:10px;cursor:pointer;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:all .15s;white-space:nowrap}
.cbtn:hover{border-color:#418FDE;color:#418FDE}
.cbtn.on{background:#418FDE;border-color:#418FDE;color:#fff}
.cbtn.pause.on{background:#FF671F;border-color:#FF671F}
#spd-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#5a7090}

.clist{overflow-y:auto;padding:6px}
.clist::-webkit-scrollbar{width:3px}
.clist::-webkit-scrollbar-thumb{background:#2a3a54}

.citem{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;margin-bottom:2px}
.citem:hover{background:rgba(255,255,255,.04)}
.citem.on{background:rgba(255,107,53,.08);border-left-color:#FF671F}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cinfo{flex:1;min-width:0}
.cname{font-size:11px;font-weight:700;color:#e8eaf0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{font-size:9px;color:#5a7090;margin-top:1px}
.ctag{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}

/* DETAIL PANEL */
.detail{border-top:1px solid #1e2d44;overflow-y:auto;padding:10px 12px;background:rgba(0,0,0,.2)}
.detail::-webkit-scrollbar{width:3px}
.detail::-webkit-scrollbar-thumb{background:#2a3a54}
.detail-title{font-size:12px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #1e2d44}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:8px}
.kpi{background:rgba(255,255,255,.04);border-radius:5px;padding:5px 6px;text-align:center}
.kv{font-size:15px;font-weight:700;color:#FFB81C;line-height:1}
.kl{font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:#5a7090;margin-top:1px;line-height:1.2}
.sec-title{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#5a7090;margin:8px 0 4px}
.brow{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.blbl{font-size:10px;color:#c0ccde;width:95px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrk{flex:1;height:10px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.bfil{height:10px;border-radius:2px}
.bval{font-size:9px;color:#8a9ab5;width:30px;text-align:right;flex-shrink:0}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:2px 2px 0 0}

/* STATS TOP RIGHT */
#stats{position:absolute;top:12px;right:12px;z-index:20}
.sbox{background:rgba(10,16,28,.92);border:1px solid #2a3a54;border-radius:8px;padding:8px 14px;text-align:right;margin-bottom:6px}
.snum{font-size:26px;font-weight:700;color:#FFB81C;line-height:1;font-variant-numeric:tabular-nums}
.slbl{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:#5a7090;margin-top:1px}

/* BOTTOM LEGEND */
#leg{position:absolute;bottom:14px;right:12px;z-index:20;background:rgba(10,16,28,.92);border:1px solid #2a3a54;border-radius:8px;padding:8px 12px;font-size:10px;color:#8a9ab5}
.li{display:flex;align-items:center;gap:7px;padding:2px 0}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lline{width:18px;height:2px;border-radius:1px;flex-shrink:0}

/* Pulse rings on SVG markers */
@keyframes pulse{0%{r:7;opacity:.8}60%{r:20;opacity:0}100%{r:20;opacity:0}}
.pr{animation:pulse 2.2s ease-out infinite}
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <canvas id="canvas"></canvas>

  <!-- LEFT PANEL -->
  <div id="left">
    <div class="ph">
      <h1>Sudan Cross-Border Inflow</h1>
      <p>IOM DTM · Animated Movement Flows</p>
    </div>
    <div class="ctrl">
      <button class="cbtn pause on" id="playbtn" onclick="togglePlay()">⏸ Pause</button>
      <button class="cbtn" onclick="setAll()">All</button>
      <span class="cbtn on" id="s2" onclick="setSpd(1,'s2')">1×</span>
      <span class="cbtn" id="s3" onclick="setSpd(2,'s3')">2×</span>
      <span class="cbtn" id="s05" onclick="setSpd(.5,'s05')">½×</span>
    </div>
    <div class="clist" id="clist"></div>
    <div class="detail" id="detail" style="display:none"></div>
  </div>

  <!-- STATS -->
  <div id="stats">
    <div class="sbox"><div class="snum" id="pcnt">0</div><div class="slbl">active flows</div></div>
  </div>

  <!-- LEGEND -->
  <div id="leg">
    <div class="li"><div class="ldot" style="background:#FF671F"></div>Sudan / destination state</div>
    <div class="li"><div class="ldot" style="background:#fff;opacity:.6"></div>Border crossing</div>
    <div class="li"><div class="lline" style="background:linear-gradient(90deg,#418FDE,#FF671F)"></div>Flow route (animated)</div>
  </div>
</div>

<script>
const CROSS=[

  {id:'umdukhun',n:'Um Dukhun',country:'Chad',lat:11.139,lng:22.966,clr:'#2563B0',

   reasons:[{l:'Business/trade',v:59.3,clr:'#F0AD4E'},{l:'Econ. deterioration',v:38.2,clr:'#F0AD4E'},{l:'Economic reasons',v:22.1,clr:'#F0AD4E'},{l:'Family visit',v:13,clr:'#418FDE'},{l:'Conflict/violence',v:11.7,clr:'#D9534F'}],
   movement:[{l:'Move to 3rd location',v:43.5,clr:'#F0AD4E'},{l:'Move outside Sudan',v:39.7,clr:'#418FDE'},{l:'Return to origin',v:16.9,clr:'#5CB85C'}],
   border_top:['Long processing: 60.5%','Insecurity: 52.1%','Bribery/extortion: 48%']},

   dests:[{n:'Gedaref',lat:14.0,lng:35.4,w:37},{n:'Kassala',lat:15.5,lng:36.4,w:20},{n:'Khartoum',lat:15.5,lng:32.5,w:23},{n:'Aj Jazirah',lat:14.9,lng:33.4,w:11}],
   profile:{age:38.7,agem:36,male:77.2,alone:93,sudanese:74.6,disp:23.7,still:92.6,vol:0},
   transport:[{l:'On foot / animal cart',v:100,clr:'#5CB8B2'}],
   reasons:[{l:'Econ. deterioration',v:33.3,clr:'#F0AD4E'},{l:'Business/trade',v:33.3,clr:'#F0AD4E'},{l:'Family visit',v:16.7,clr:'#418FDE'},{l:'Consular services',v:16.7,clr:'#5CB8B2'}],
   movement:[{l:'Return to origin',v:48.2,clr:'#5CB85C'},{l:'Move outside Sudan',v:43.9,clr:'#418FDE'},{l:'Move to 3rd location',v:7.9,clr:'#F0AD4E'}],
   border_top:['Loss of belongings: 31.6%','Language barriers: 21.1%','Insecurity: 24.6%']},
  {id:'argeen',n:'Argeen',country:'Egypt',lat:21.989,lng:31.153,clr:'#FFB81C',
   dests:[{n:'Khartoum',lat:15.5,lng:32.5,w:35},{n:'Aj Jazirah',lat:14.9,lng:33.4,w:20},{n:'River Nile',lat:18.5,lng:33.8,w:13},{n:'Northern State',lat:19.6,lng:30.4,w:12},{n:'Red Sea',lat:19.6,lng:37.1,w:5}],
   profile:{age:38.7,agem:38,male:75,alone:46.6,sudanese:100,disp:87.6,still:74.3,vol:88.3},
   transport:[{l:'Public transport (bus)',v:99.8,clr:'#FFB81C'},{l:'Goods vehicle',v:0.1,clr:'#c09010'},{l:'Private/rented',v:0.1,clr:'#c09010'}],
   reasons:[{l:'Conflict/violence',v:76.1,clr:'#D9534F'},{l:'Econ. deterioration',v:41.4,clr:'#F0AD4E'},{l:'Depletion of resources',v:22.1,clr:'#F0AD4E'},{l:'Family visit',v:11.2,clr:'#418FDE'},{l:'Medical treatment',v:5.5,clr:'#5CB8B2'}],
   movement:[{l:'Return to origin',v:78.1,clr:'#5CB85C'},{l:'Move to 3rd location',v:20.8,clr:'#F0AD4E'},{l:'Move outside Sudan',v:1,clr:'#418FDE'}],
   border_top:['Long processing: 4.7%','Harassment: 0.5%']},
  {id:'ashkeet',n:'Ashkeet',country:'Egypt',lat:22.001,lng:31.511,clr:'#E8A800',
   dests:[{n:'Khartoum',lat:15.5,lng:32.5,w:41},{n:'Northern State',lat:19.6,lng:30.4,w:16},{n:'Aj Jazirah',lat:14.9,lng:33.4,w:14},{n:'River Nile',lat:18.5,lng:33.8,w:7.5}],
   profile:{age:39.9,agem:37,male:57.6,alone:37.8,sudanese:100,disp:43,still:48.6,vol:87.6},
   transport:[{l:'Public transport (bus)',v:99.9,clr:'#E8A800'},{l:'Private/rented',v:0.1,clr:'#a07800'}],
   reasons:[{l:'Conflict/violence',v:39.2,clr:'#D9534F'},{l:'Business/trade',v:22.5,clr:'#F0AD4E'},{l:'Medical treatment',v:22,clr:'#5CB8B2'},{l:'Family visit',v:8.6,clr:'#418FDE'},{l:'Education',v:7.1,clr:'#5CB85C'}],
   movement:[{l:'Return to origin',v:65.9,clr:'#5CB85C'},{l:'Move to 3rd location',v:30.4,clr:'#F0AD4E'},{l:'Move outside Sudan',v:3.7,clr:'#418FDE'}],
   border_top:['Long processing: 16.7%','Harassment: 16.9%','Forced return: 11.6%']},
];

const CC={'Chad':'#418FDE','Egypt':'#FFB81C','Ethiopia':'#5CB8B2'};
const SUDAN={lat:15.5,lng:30.5};

let sel=null,playing=true,speed=1;
let particles=[],lastT=0,animId;

const map=L.map('map',{center:[16,30],zoom:5,scrollWheelZoom:true,minZoom:3,maxZoom:9,attributionControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'© CARTO'}).addTo(map);

/* Markers */
const sudanIco=L.divIcon({className:'',html:`<svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="19" fill="#FF671F" opacity=".1"/><circle cx="27" cy="27" r="12" fill="#FF671F" opacity=".35"/><circle cx="27" cy="27" r="5.5" fill="#FF671F"/></svg>`,iconSize:[54,54],iconAnchor:[27,27]});
L.marker([SUDAN.lat,SUDAN.lng],{icon:sudanIco,zIndexOffset:2000}).addTo(map).bindTooltip('<b style="color:#FF671F">SUDAN</b><br><small style="color:#aaa">Destination country</small>',{direction:'right'});

const mkrs={};
CROSS.forEach(c=>{
  const ico=L.divIcon({className:'',html:`<svg width="44" height="44" viewBox="0 0 44 44">
    <circle cx="22" cy="22" r="8" fill="${c.clr}"/>
    <circle class="pr" cx="22" cy="22" r="8" fill="none" stroke="${c.clr}" stroke-width="1.4" style="animation-delay:${(Math.random()*1.5).toFixed(2)}s"/>
  </svg>`,iconSize:[44,44],iconAnchor:[22,22]});
  mkrs[c.id]=L.marker([c.lat,c.lng],{icon:ico,zIndexOffset:500}).addTo(map)
    .on('click',()=>pick(c.id))
    .on('mouseover',(e)=>{showTip(e,c)})
    .on('mouseout',()=>{})
    .bindPopup(`<b style="color:${c.clr};font-size:13px">${c.n}</b><br>${c.country} · ${c.lat.toFixed(3)}°N ${c.lng.toFixed(3)}°E`);
});

/* Canvas */
const cvs=document.getElementById('canvas');
const ctx=cvs.getContext('2d');
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();cvs.width=r.width;cvs.height=r.height}
resize();window.addEventListener('resize',()=>{resize();rebuild()});
map.on('moveend zoomend',rebuild);
map.on('move zoom',()=>render(lastT,false));

function px(lat,lng){const p=map.latLngToContainerPoint([lat,lng]);return{x:p.x,y:p.y}}
function bez(t,a,cp,b){const m=1-t;return{x:m*m*a.x+2*m*t*cp.x+t*t*b.x,y:m*m*a.y+2*m*t*cp.y+t*t*b.y}}
function ctrlPt(a,b){
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,n=Math.sqrt(dx*dx+dy*dy)||1,cv=n*.3;
  return{x:mx-(dy/n)*cv,y:my+(dx/n)*cv};
}

/* Destination labels layer */
const destSet={};
CROSS.forEach(c=>c.dests.forEach(d=>{if(!destSet[d.n])destSet[d.n]={lat:d.lat,lng:d.lng}}));

function mkParticle(c,d){
  return{cx:c,dlat:d.lat,dlng:d.lng,dn:d.n,
    t:Math.random(),sp:.00035+Math.random()*.00035,
    sz:1.4+Math.random()*1.5,al:.6+Math.random()*.35,
    trail:[]
  };
}

function rebuild(){
  particles=[];
  const list=sel?CROSS.filter(c=>c.id===sel):CROSS;
  list.forEach(c=>{
    c.dests.forEach(d=>{
      const n=Math.max(3,Math.round(d.w/7));
      for(let i=0;i<n;i++) particles.push(mkParticle(c,d));
    });
  });
}

function drawRoutes(){
  ctx.save();
  const list=sel?CROSS.filter(c=>c.id===sel):CROSS;
  list.forEach(c=>{
    c.dests.forEach(d=>{
      const a=px(c.lat,c.lng),b=px(d.lat,d.lng),cp=ctrlPt(a,b);
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(cp.x,cp.y,b.x,b.y);
      ctx.strokeStyle=sel?'rgba(255,255,255,.14)':'rgba(255,255,255,.05)';
      ctx.lineWidth=sel?.8:.4;ctx.setLineDash([3,9]);ctx.stroke();ctx.setLineDash([]);
    });
  });
  ctx.restore();
}

function drawDestinations(){
  const list=sel?CROSS.filter(c=>c.id===sel):CROSS;
  const seen=new Set();
  list.forEach(c=>{
    c.dests.forEach(d=>{
      if(seen.has(d.n)) return;seen.add(d.n);
      const p=px(d.lat,d.lng);
      ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fillStyle='rgba(255,107,53,.5)';ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,9,0,Math.PI*2);ctx.strokeStyle='rgba(255,107,53,.2)';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='rgba(255,150,80,.8)';ctx.font='bold 9px system-ui';ctx.textAlign='center';
      ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=4;
      ctx.fillText(d.n,p.x,p.y-13);ctx.shadowBlur=0;
    });
  });
}

function rgb(h){return`${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`}

function render(ts,doUpdate){
  const dt=doUpdate&&playing&&ts?(ts-lastT)*speed:0;
  if(doUpdate) lastT=ts;
  ctx.clearRect(0,0,cvs.width,cvs.height);
  drawRoutes();
  drawDestinations();
  let count=0;
  particles.forEach(p=>{
    if(doUpdate&&playing) p.t=(p.t+p.sp*dt)%1;
    const from=px(p.cx.lat,p.cx.lng),to=px(p.dlat,p.dlng),cp=ctrlPt(from,to);
    const pos=bez(p.t,from,cp,to);
    const TLEN=10;
    p.trail.push({x:pos.x,y:pos.y});
    if(p.trail.length>TLEN) p.trail.shift();
    if(p.trail.length>1){
      for(let i=1;i<p.trail.length;i++){
        const ta=i/p.trail.length;
        ctx.beginPath();ctx.moveTo(p.trail[i-1].x,p.trail[i-1].y);ctx.lineTo(p.trail[i].x,p.trail[i].y);
        ctx.strokeStyle=`rgba(${rgb(p.cx.clr)},${ta*p.al*.6})`;ctx.lineWidth=p.sz*ta;ctx.stroke();
      }
    }
    ctx.beginPath();ctx.arc(pos.x,pos.y,p.sz*2,0,Math.PI*2);
    ctx.fillStyle=`rgba(${rgb(p.cx.clr)},${p.al*.35})`;ctx.fill();
    ctx.beginPath();ctx.arc(pos.x,pos.y,p.sz,0,Math.PI*2);
    ctx.fillStyle=`rgba(${rgb(p.cx.clr)},${p.al})`;ctx.fill();
    count++;
  });
  document.getElementById('pcnt').textContent=count;
}

function frame(ts){render(ts,true);animId=requestAnimationFrame(frame)}
animId=requestAnimationFrame(t=>{lastT=t;frame(t)});

/* Controls */
function togglePlay(){
  playing=!playing;
  const b=document.getElementById('playbtn');
  b.classList.toggle('on',playing);b.textContent=playing?'⏸ Pause':'▶ Play';
}
function setSpd(s,id){
  speed=s;['s05','s2','s3'].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('on')});
  const el=document.getElementById(id);if(el)el.classList.add('on');
}
function setAll(){
  sel=null;buildList();rebuild();
  document.getElementById('detail').style.display='none';
  map.flyTo([16,30],5,{duration:.8});
}

/* Crossing list */
function buildList(){
  document.getElementById('clist').innerHTML=CROSS.map(c=>`
    <div class="citem${c.id===sel?' on':''}" onclick="pick('${c.id}')">
      <div class="cdot" style="background:${c.clr}"></div>
      <div class="cinfo">
        <div class="cname">${c.n}</div>
        <div class="cmeta">${c.lat.toFixed(3)}°N · ${c.dests.length} destinations</div>
      </div>
      <span class="ctag" style="background:${CC[c.country]}22;color:${CC[c.country]}">${c.country}</span>
    </div>`).join('');
}

/* Pick crossing */
function pick(id){
  sel=sel===id?null:id;
  buildList();rebuild();
  if(!sel){document.getElementById('detail').style.display='none';map.flyTo([16,30],5,{duration:.8});return}
  const c=CROSS.find(x=>x.id===id);
  map.flyTo([c.lat,c.lng],7,{duration:.9});
  showDetail(c);
}

function showDetail(c){
  const d=document.getElementById('detail');
  d.style.display='block';
  const destBars=c.dests.map(dd=>`
    <div class="brow">
      <span class="blbl">${dd.n}</span>
      <div class="btrk"><div class="bfil" style="width:${Math.min(100,dd.w)}%;background:${c.clr}"></div></div>
      <span class="bval">${dd.w}%</span>
    </div>`).join('');
  const transBars=c.transport.map(t=>`
    <div class="brow">
      <span class="blbl">${t.l}</span>
      <div class="btrk"><div class="bfil" style="width:${Math.min(100,t.v)}%;background:${t.clr}"></div></div>
      <span class="bval">${t.v}%</span>
    </div>`).join('');
  const reasonBars=c.reasons.map(r=>`
    <div class="brow">
      <span class="blbl">${r.l}</span>
      <div class="btrk"><div class="bfil" style="width:${Math.min(100,r.v)}%;background:${r.clr}"></div></div>
      <span class="bval">${r.v}%</span>
    </div>`).join('');
  const moveBars=c.movement.map(m=>`
    <div class="brow">
      <span class="blbl">${m.l}</span>
      <div class="btrk"><div class="bfil" style="width:${Math.min(100,m.v)}%;background:${m.clr}"></div></div>
      <span class="bval">${m.v}%</span>
    </div>`).join('');
  const borderBadges=c.border_top.map(b=>`<span class="badge" style="background:rgba(217,83,79,.15);color:#ff6b6b;border:1px solid rgba(217,83,79,.3)">⚠ ${b}</span>`).join('');

  d.innerHTML=`
    <div class="detail-title" style="color:${c.clr}">${c.n} <span style="font-size:10px;color:#5a7090;font-weight:400">· ${c.country}</span></div>
    <div class="kpis">
      <div class="kpi"><div class="kv">${c.profile.age}</div><div class="kl">Avg age</div></div>
      <div class="kpi"><div class="kv">${c.profile.male}%</div><div class="kl">Male</div></div>
      <div class="kpi"><div class="kv">${c.profile.alone}%</div><div class="kl">Alone</div></div>
      <div class="kpi"><div class="kv">${c.profile.sudanese}%</div><div class="kl">Sudanese</div></div>
      <div class="kpi" style="border:1px solid rgba(255,184,28,.25)"><div class="kv">${c.profile.disp}%</div><div class="kl">Disp. '23</div></div>
      <div class="kpi"><div class="kv">${c.profile.still}%</div><div class="kl">Still disp.</div></div>
    </div>

    <div class="sec-title">Destinations inside Sudan</div>${destBars}
    <div class="sec-title">Transport mode</div>${transBars}
    <div class="sec-title">Reasons for leaving Sudan</div>${reasonBars}
    <div class="sec-title">Movement intentions (3 months)</div>${moveBars}
    <div class="sec-title">Top border issues</div><div>${borderBadges}</div>
  `;
}

function showTip(e,c){
  const t=e.target._icon;if(t) t.title=`${c.n} · ${c.country}`;
}

/* ═══════════════ BORDERS ═══════════════
   Sudan outline + neighbouring countries loaded from public GeoJSON APIs.
   We use the Natural Earth / GADM via Leaflet's built-in fetch.
   Fallback: simplified inline polygons for Sudan + neighbours.
═══════════════════════════════════════ */

/* ── Sudan approximate border (simplified polygon) ── */
const SUDAN_BORDER = {
  type:'Feature',properties:{name:'Sudan'},
  geometry:{type:'Polygon',coordinates:[[
    [24.0,8.5],[23.5,11.0],[23.1,12.5],[22.5,14.0],[22.0,15.0],[21.8,16.5],[22.5,18.0],[23.0,20.0],[24.0,22.0],
    [25.0,22.4],[26.0,22.0],[28.0,22.0],[30.5,22.0],[31.5,22.0],[32.0,21.9],[33.5,22.0],[36.9,22.0],
    [37.5,21.0],[38.0,19.5],[38.2,17.0],[37.5,15.5],[36.5,14.5],[36.0,13.0],[35.5,12.0],[35.0,11.0],

    [27.0,7.8],[26.5,8.0],[25.5,8.5],[24.5,8.5],[24.0,8.5]
  ]]}
};

/* ── Neighbouring countries (simplified) ── */
const NEIGHBOURS = [
  {name:'Egypt', clr:'#FFB81C', coords:[[

    [37.0,26.0],[34.0,27.5],[32.5,29.0],[30.0,30.0],[27.0,30.5],[25.0,30.0],[24.0,27.0],[24.7,25.0],[24.0,22.0]
  ]]},
  {name:'Ethiopia', clr:'#5CB8B2', coords:[[
    [35.0,11.0],[35.5,12.0],[36.0,13.0],[36.5,14.5],[37.5,15.5],[38.2,17.0],[38.0,19.5],[40.0,18.0],
    [42.0,16.5],[43.0,14.0],[43.5,12.5],[43.0,11.5],[42.0,10.5],[40.5,10.0],[39.0,9.5],[37.5,9.0],
    [36.0,8.5],[35.0,9.0],[35.0,11.0]
  ]]},
  {name:'Chad', clr:'#418FDE', coords:[[
    [22.0,15.0],[22.5,14.0],[23.1,12.5],[23.5,11.0],[24.0,8.5],[24.5,8.5],[23.5,8.0],[22.0,8.0],
    [20.0,7.5],[18.0,7.0],[16.0,7.5],[14.0,9.0],[13.5,11.0],[14.0,13.0],[14.5,15.0],[15.5,16.0],
    [16.0,18.0],[17.0,20.0],[19.0,21.5],[20.0,21.0],[22.0,20.0],[22.0,15.0]
  ]]},
  {name:'Central African Republic', clr:'#9B59B6', coords:[[
    [24.0,8.5],[24.5,8.5],[25.5,8.5],[26.5,8.0],[27.0,7.8],[28.0,8.0],[27.5,6.5],[26.0,5.5],
    [24.5,5.0],[23.0,5.5],[21.5,6.0],[20.5,7.0],[22.0,8.0],[23.5,8.0],[24.0,8.5]
  ]]},
  {name:'South Sudan', clr:'#FF671F', coords:[[
    [24.0,8.5],[24.5,8.5],[25.5,8.5],[26.5,8.0],[27.0,7.8],[28.0,8.0],[29.0,8.0],[30.0,8.0],

    [34.0,8.0],[32.5,7.0],[31.0,6.0],[29.5,5.5],[28.0,5.5],[26.5,6.5],[25.0,7.5],[24.0,8.5]
  ]]},
  {name:'Libya', clr:'#E8A800', coords:[[

  {name:'Eritrea', clr:'#E74C3C', coords:[[

    [38.2,17.0],[38.0,19.5],[37.5,21.0],[36.9,22.0]
  ]]}
];

/* Draw neighbouring country fills */
NEIGHBOURS.forEach(nb => {
  L.polygon(nb.coords[0].map(c=>[c[1],c[0]]),{
    color: nb.clr,
    weight: 1.4,
    opacity: 0.7,
    fillColor: nb.clr,
    fillOpacity: 0.04,
    dashArray: '4 5',
    interactive: false
  }).addTo(map).bindTooltip(nb.name,{sticky:true,className:'',direction:'center'});
});

/* Draw Sudan border — bright solid outline */
L.polygon(SUDAN_BORDER.geometry.coordinates[0].map(c=>[c[1],c[0]]),{
  color: '#FF671F',
  weight: 2,
  opacity: 0.85,
  fillColor: '#FF671F',
  fillOpacity: 0.06,
  interactive: false
}).addTo(map);

/* Sudan label */
L.marker([15.5,30.5],{
  icon:L.divIcon({className:'',html:`<div style="color:#FF671F;font-size:11px;font-weight:700;font-family:system-ui;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 6px #000;white-space:nowrap">SUDAN</div>`,iconAnchor:[22,8]}),
  interactive:false, zIndexOffset:999
}).addTo(map);

/* Country name labels */
const CLABELS=[
  {n:'Egypt',lat:27,lng:30},{n:'Chad',lat:15,lng:18},{n:'Ethiopia',lat:10,lng:40},
  {n:'Libya',lat:27,lng:18},{n:'S. Sudan',lat:6.5,lng:30},{n:'C.A.R.',lat:6.5,lng:21},{n:'Eritrea',lat:16,lng:39}
];
CLABELS.forEach(l=>{
  const nb=NEIGHBOURS.find(n=>n.name.includes(l.n.replace('S. ','South ').replace('C.A.R.','Central')));
  const clr=nb?nb.clr:'#aaa';
  L.marker([l.lat,l.lng],{
    icon:L.divIcon({className:'',html:`<div style="color:${clr};font-size:9px;font-weight:700;font-family:system-ui;letter-spacing:.07em;text-transform:uppercase;opacity:.75;text-shadow:0 1px 5px #000;white-space:nowrap">${l.n}</div>`,iconAnchor:[18,7]}),
    interactive:false,zIndexOffset:100
  }).addTo(map);
});

/* ── Active border crossing markers — highlighted with country-color rings ── */
CROSS.forEach(c=>{
  const nb=NEIGHBOURS.find(n=>n.name===c.country);
  const bclr=nb?nb.clr:c.clr;
  /* Crossing point marker — larger outer ring in country color */
  L.circleMarker([c.lat,c.lng],{
    radius:14, color:bclr, weight:1.5, opacity:0.5,
    fillColor:bclr, fillOpacity:0.08, interactive:false
  }).addTo(map);
  /* Label */
  L.marker([c.lat,c.lng],{
    icon:L.divIcon({className:'',
      html:`<div style="color:${bclr};font-size:9px;font-weight:700;font-family:system-ui;letter-spacing:.04em;white-space:nowrap;text-shadow:0 1px 5px #000;margin-top:18px;text-align:center">${c.n}</div>`,
      iconAnchor:[30,0]
    }),
    interactive:false, zIndexOffset:600
  }).addTo(map);
});

/* Update legend */
document.getElementById('leg').innerHTML=`
  <div style="font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#5a7090;margin-bottom:6px;font-weight:700">Legend</div>
  <div class="li"><div class="ldot" style="background:#FF671F;border:1px solid #FF671F"></div>Sudan (host country)</div>
  <div class="li"><div style="width:18px;height:1px;border:1px dashed #418FDE;flex-shrink:0"></div>Chad border</div>
  <div class="li"><div style="width:18px;height:1px;border:1px dashed #FFB81C;flex-shrink:0"></div>Egypt border</div>
  <div class="li"><div style="width:18px;height:1px;border:1px dashed #5CB8B2;flex-shrink:0"></div>Ethiopia border</div>
  <div class="li"><div class="ldot" style="background:#fff;opacity:.7"></div>Border crossing point</div>
  <div class="li"><div class="lline" style="background:linear-gradient(90deg,#418FDE,#FF671F)"></div>Flow route (animated)</div>
`;

buildList();
setTimeout(rebuild,500);
</script>
